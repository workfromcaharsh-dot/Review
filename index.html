<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Assistant</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .name-row {
            display: flex;
            gap: 15px;
        }

        .name-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        label span {
            font-size: 0.8rem;
            color: #6b7280;
            font-weight: normal;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .selection-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 5px 2px;
        }

        .radio-label, .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            font-size: 0.95rem;
            cursor: pointer;
            margin-bottom: 0;
        }

        .checkbox-label.disabled {
            color: #9ca3af;
            cursor: not-allowed;
        }

        input[type="radio"], input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
        }

        .other-input-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .other-text-field {
            padding: 6px 10px !important;
            font-size: 0.9rem !important;
            width: auto !important;
            flex-grow: 1;
        }

        .action-container {
            text-align: center;
            margin-top: 25px;
        }

        .ai-btn {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
        }

        .ai-btn:hover {
            background-color: #059669;
        }

        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #9ca3af;
        }

        .draft-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 1rem;
            line-height: 1.5;
            white-space: pre-line;
        }

        .copy-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 10px;
        }

        .copy-btn:hover {
            background: #4338ca;
        }

        .google-link-container {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .google-link {
            display: none; 
            color: #2563eb;
            font-weight: bold;
            text-decoration: underline;
            font-size: 1.05rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Submit Your Review</h2>
        <form id="reviewForm" onsubmit="event.preventDefault();">
            <div class="name-row form-group">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="e.g., Kajal" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="e.g., Patel" required>
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label>Profession</label>
                <div class="selection-list">
                    <label class="radio-label">
                        <input type="radio" name="profession" value="Student" required> Student
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="profession" value="Business"> Business
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="profession" value="Government Employee"> Government Employee
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="profession" value="Salaried Employee"> Salaried Employee
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="e.g., Anand, Gujarat" required>
            </div>

            <div class="form-group">
                <label>Business Category Availed <span>(you can select multiple category)</span></label>
                <div class="selection-list">
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Accounting" onchange="handleCategoryChange(this)"> Accounting
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Audits" onchange="handleCategoryChange(this)"> Audits
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="GST" onchange="handleCategoryChange(this)"> GST
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Income Tax Return (ITR)" onchange="handleCategoryChange(this)"> Income Tax Return (ITR)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Financing" onchange="handleCategoryChange(this)"> Financing
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Bookkeeping Service" onchange="handleCategoryChange(this)"> Bookkeeping Service
                    </label>
                    <div class="other-input-container">
                        <label class="checkbox-label">
                            <input type="checkbox" id="otherCheckbox" value="Other" onchange="handleOtherChange(this)"> Other —
                        </label>
                        <input type="text" id="otherText" class="other-text-field" placeholder="Enter your business type" disabled>
                    </div>
                </div>
            </div>

            <div class="action-container">
                <button type="button" class="ai-btn" onclick="generateAndShowPopUp()">✨ Generate AI Review</button>
            </div>
        </form>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3>Your Generated Draft</h3>
            
            <div class="draft-box" id="draftText"></div>

            <button class="copy-btn" onclick="copyDraft()">
                📋 <span id="copyBtnText">Copy Draft Text</span>
            </button>

            <div class="google-link-container">
                <a href="https://g.page/r/CS0dngZ-ASEbEBM/review" 
                   target="_blank" 
                   class="google-link" 
                   id="googleLink">
                   👉 Click here to paste your review on Google
                </a>
            </div>
        </div>
    </div>

    <script>
        // High-end, corporate, and professional review text structures
        const reviewComponents = {
            "Accounting": {
                openings: ["Exceptional corporate financial advisory from a highly knowledgeable team.", "Their strategic approach to handling company accounts is outstanding.", "They offer a highly reliable and professional financial partnership."],
                cores: ["They systematically restructured our accounting framework and fixed data anomalies perfectly.", "Their precision in asset management and active balance analysis saved us significant capital.", "They provide deep corporate insights and manage complex financial portfolios with complete accuracy."],
                closings: ["An absolute asset for long-term business growth.", "Highly recommended for corporate financial oversight.", "Superb attention to detail and flawless execution."]
            },
            "Audits": {
                openings: ["They conducted our company's statutory audit with complete transparency.", "Highly rigorous and professional corporate audit performance.", "Their systematic approach to financial verification is top-tier."],
                cores: ["They meticulously analyzed our operational records and provided incredibly actionable compliance guidance.", "Every regulatory requirement was met perfectly, and they simplified our statutory reports.", "Their detailed observation and reporting helped optimize our corporate internal controls."],
                closings: ["Exceptional professionals for high-level compliance handling.", "Their structural integrity and work ethic are highly commendable.", "Strongly recommended for internal and statutory audits."]
            },
            "GST": {
                openings: ["Their team completely streamlined our multi-state GST filing structure.", "Flawless management of corporate indirect tax portfolios and cross-border adjustments.", "Highly efficient resolution of complex GST advisory matters."],
                cores: ["They managed to seamlessly reconcile our past returns and optimize our Input Tax Credit allocation.", "They track tax portal amendments instantly and maintain zero-error compliance levels.", "Their fast response to real-time transactional invoicing issues keeps our operations smooth."],
                closings: ["The best advisory team for handling high-volume indirect tax returns.", "Incredibly professional approach to complex tax portal filing.", "Highly dependable execution from start to finish."]
            },
            "Income Tax Return (ITR)": {
                openings: ["Exceptional advisory support during our annual corporate income tax filing.", "They offer highly strategic tax planning and structured filing workflows.", "Their deep insight into changing direct tax regulations is incredibly valuable."],
                cores: ["They analyzed our income portfolios meticulously to ensure legal tax optimization under the ideal regime.", "The entire documentation and filing process was executed flawlessly with zero technical delays.", "They break down complex deduction pathways so our corporate filings remain completely secure."],
                closings: ["Highly recommend their firm for corporate tax structure optimization.", "Extremely pleased with their thorough direct tax consultancy.", "A trusted and highly professional partner for all annual filings."]
            },
            "Financing": {
                openings: ["They delivered outstanding strategic consultation regarding our corporate fundraising goals.", "Their technical guidance during capital structure evaluation was invaluable.", "An exceptionally well-connected and highly resourceful corporate advisory team."],
                cores: ["They structured our project underwriting documents perfectly to streamline approval timelines.", "Their detailed market assessments completely transformed our corporate credit strategy.", "They broke down long fiscal underwriting procedures into simple execution milestones."],
                closings: ["Superb financial strategists for expanding commercial operations.", "We achieved our target project capital requirements seamlessly thanks to them.", "Highly technical advisory execution."]
            },
            "Bookkeeping Service": {
                openings: ["They maintain impeccable standards regarding daily transactional recording.", "Our real-time ledger records are kept perfectly organized and auditable.", "Exceptional reliability regarding corporate ledger reconciliation data updates."],
                cores: ["Our balances are reconciled flawlessly down to the penny with zero administrative oversight required.", "They structured our unstructured entry systems into clean, real-time balance spreadsheets.", "They handle high-volume data streams promptly without needing continuous validation checks."],
                closings: ["Highly recommend their professional commercial bookkeeping plans.", "Outstanding day-to-day transaction records accuracy.", "A truly dependable operations support team."]
            },
            "Other": {
                openings: ["They delivered an outstanding professional execution from start to finish.", "A highly sophisticated corporate service experience driven by a dedicated workforce.", "They exceeded all our expectations across every operational metric."],
                cores: ["The entire engagement was handled with meticulous precision and excellent project tracking.", "They prioritize institutional workflow safety and maintain transparent communication pathways throughout.", "Their execution speeds, clear framework pricing, and dedicated corporate support are unmatched."],
                closings: ["We will definitely expand our partnership with them in future phases.", "Highly recommended for organizations looking for elite corporate assistance.", "Deep gratitude for the exceptional support."]
            }
        };

        function handleOtherChange(otherCheckbox) {
            const standardCategories = document.querySelectorAll('input[name="category"]');
            const otherTextField = document.getElementById('otherText');
            
            if (otherCheckbox.checked) {
                standardCategories.forEach(cb => {
                    cb.checked = false;
                    cb.disabled = true;
                    cb.parentElement.classList.add('disabled');
                });
                otherTextField.disabled = false;
                otherTextField.required = true;
                otherTextField.focus();
            } else {
                standardCategories.forEach(cb => {
                    cb.disabled = false;
                    cb.parentElement.classList.remove('disabled');
                });
                otherTextField.disabled = true;
                otherTextField.required = false;
                otherTextField.value = "";
            }
        }

        function handleCategoryChange(checkbox) {
            document.getElementById('otherCheckbox').checked = false;
            document.getElementById('otherText').disabled = true;
            document.getElementById('otherText').required = false;
            document.getElementById('otherText').value = "";
        }

        function getSelectedCategories() {
            const isOtherChecked = document.getElementById('otherCheckbox').checked;
            if (isOtherChecked) {
                const customVal = document.getElementById('otherText').value.trim();
                return customVal ? [customVal] : ["Other"];
            }

            const checkboxes = document.querySelectorAll('input[name="category"]:checked');
            const selected = [];
            checkboxes.forEach(cb => {
                selected.push(cb.value);
            });
            return selected;
        }

        function generateAndShowPopUp() {
            const fname = document.getElementById('firstName').value.trim();
            const lname = document.getElementById('lastName').value.trim();
            const location = document.getElementById('location').value.trim();
            const checkedProfession = document.querySelector('input[name="profession"]:checked');
            const categories = getSelectedCategories();

            if (!fname || !lname) {
                alert("Please fill out both First Name and Last Name fields.");
                return;
            }
            if (!checkedProfession) {
                alert("Please select your Profession.");
                return;
            }
            if (!location) {
                alert("Please enter your Location.");
                return;
            }
            if (categories.length === 0 || (document.getElementById('otherCheckbox').checked && !document.getElementById('otherText').value.trim())) {
                alert("Please check a category or type your choice in the 'Other' field!");
                return;
            }

            const userProfession = checkedProfession.value;

            let compiledReviewParts = [];
            const isOtherChecked = document.getElementById('otherCheckbox').checked;
            let processCategories = isOtherChecked ? ["Other"] : categories;

            processCategories.forEach(cat => {
                const pool = reviewComponents[cat] || reviewComponents["Other"];
                const randomOpen = pool.openings[Math.floor(Math.random() * pool.openings.length)];
                const randomCore = pool.cores[Math.floor(Math.random() * pool.cores.length)];
                const randomClose = pool.closings[Math.floor(Math.random() * pool.closings.length)];
                compiledReviewParts.push(`${randomOpen} ${randomCore} ${randomClose}`);
            });
            const userReviewText = compiledReviewParts.join(" ");

            let categoryString = "";
            if (categories.length === 1) {
                categoryString = categories[0] + " business category";
            } else {
                categoryString = categories.slice(0, -1).join(", ") + " and " + categories[categories.length - 1] + " business categories";
            }

            const fullyBuiltDraft = `My name is ${fname} ${lname}. I am a ${userProfession} from ${location}. I avail the ${categoryString}. ${userReviewText}`;

            document.getElementById('draftText').innerText = fullyBuiltDraft;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('copyBtnText').innerText = "Copy Draft Text";
            document.getElementById('googleLink').style.display = 'none';
        }

        function copyDraft() {
            const textToCopy = document.getElementById('draftText').innerText;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                document.getElementById('copyBtnText').innerText = "Copied! ✓";
                document.getElementById('googleLink').style.display = 'inline-block';
            }).catch(err => {
                console.error('Could not copy text: ', err);
            });
        }
    </script>
</body>
</html>
