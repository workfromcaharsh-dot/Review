<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Assistant</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .name-row {
            display: flex;
            gap: 15px;
        }

        .name-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        label span {
            font-size: 0.8rem;
            color: #6b7280;
            font-weight: normal;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .selection-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 5px 2px;
        }

        .radio-label, .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            font-size: 0.95rem;
            cursor: pointer;
            margin-bottom: 0;
        }

        .checkbox-label.disabled {
            color: #9ca3af;
            cursor: not-allowed;
        }

        input[type="radio"], input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
        }

        .other-input-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .other-text-field {
            padding: 6px 10px !important;
            font-size: 0.9rem !important;
            width: auto !important;
            flex-grow: 1;
        }

        .action-container {
            text-align: center;
            margin-top: 25px;
        }

        .ai-btn {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
        }

        .ai-btn:hover {
            background-color: #059669;
        }

        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #9ca3af;
        }

        .draft-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 1rem;
            line-height: 1.5;
            white-space: pre-line;
        }

        .copy-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 10px;
        }

        .copy-btn:hover {
            background: #4338ca;
        }

        .google-link-container {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .google-link {
            display: none; 
            color: #2563eb;
            font-weight: bold;
            text-decoration: underline;
            font-size: 1.05rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Submit Your Review</h2>
        <form id="reviewForm" onsubmit="event.preventDefault();">
            <div class="name-row form-group">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="e.g., Kajal" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="e.g., Patel" required>
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label>Profession</label>
                <div class="selection-list">
                    <label class="radio-label">
                        <input type="radio" name="profession" value="Student" required> Student
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="profession" value="Business"> Business
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="profession" value="Government Employee"> Government Employee
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="profession" value="Salaried Employee"> Salaried Employee
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="e.g., Anand, Gujarat" required>
            </div>

            <div class="form-group">
                <label>Business Category Availed <span>(you can select multiple category)</span></label>
                <div class="selection-list">
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Accounting" onchange="handleCategoryChange(this)"> Accounting
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Audits" onchange="handleCategoryChange(this)"> Audits
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="GST" onchange="handleCategoryChange(this)"> GST
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Income Tax Return (ITR)" onchange="handleCategoryChange(this)"> Income Tax Return (ITR)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Financing" onchange="handleCategoryChange(this)"> Financing
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Bookkeeping Service" onchange="handleCategoryChange(this)"> Bookkeeping Service
                    </label>
                    <!-- New Categories Added Here -->
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="NRI Taxation" onchange="handleCategoryChange(this)"> NRI Taxation
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="category" value="Company Incorporation" onchange="handleCategoryChange(this)"> Company Incorporation
                    </label>
                    
                    <div class="other-input-container">
                        <label class="checkbox-label">
                            <input type="checkbox" id="otherCheckbox" value="Other" onchange="handleOtherChange(this)"> Other —
                        </label>
                        <input type="text" id="otherText" class="other-text-field" placeholder="Enter your business type" disabled>
                    </div>
                </div>
            </div>

            <div class="action-container">
                <button type="button" class="ai-btn" onclick="generateAndShowPopUp()">✨ Generate AI Review</button>
            </div>
        </form>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3>Your Generated Draft</h3>
            
            <div class="draft-box" id="draftText"></div>

            <button class="copy-btn" onclick="copyDraft()">
                📋 <span id="copyBtnText">Copy Draft Text</span>
            </button>

            <div class="google-link-container">
                <a href="https://g.page/r/CS0dngZ-ASEbEBM/review" 
                   target="_blank" 
                   class="google-link" 
                   id="googleLink">
                   👉 Click here to paste your review on Google
                </a>
            </div>
        </div>
    </div>

    <script>
        // Highly realistic, short, human-style review pools including the new items
        const reviewTemplates = {
            "Accounting": [
                "The team was super helpful with my accounts. They managed everything perfectly without any delays.",
                "Great experience here. They kept all my financial records clean and completely hassle-free.",
                "Extremely professional. They handled my business accounts smoothly and answered all my questions."
            ],
            "Audits": [
                "Our business audit went incredibly smooth. The team is thorough and very professional.",
                "They made the whole audit process clear and stress-free for us. Excellent compliance support.",
                "Very satisfied with their audit work. Meticulous, fast, and completely dependable."
            ],
            "GST": [
                "They made my monthly GST filings completely stress-free. Very prompt and reliable support.",
                "Excellent handling of our GST portal work. Saved us a lot of time and potential compliance issues.",
                "Super responsive whenever I have any queries regarding GST invoicing and returns."
            ],
            "Income Tax Return (ITR)": [
                "Filing my ITR was never this quick before. They sorted my taxes perfectly with zero hassle.",
                "Highly recommend them for tax planning. They handled my tax returns quickly and saved me a lot of stress.",
                "Very professional team. They filed my ITR on time and made the entire process simple."
            ],
            "Financing": [
                "Got excellent financial advice here. They helped guide us through our options very clearly.",
                "Very practical insights and great support for our funding requirements. Highly recommended.",
                "They made complex financial procedures look very simple. Great consultants to work with."
            ],
            "Bookkeeping Service": [
                "Our day-to-day books are perfectly organized now. Reliable data tracking every month.",
                "Excellent bookkeeping work. They logs everything cleanly and match ledgers perfectly.",
                "Highly recommend their bookkeeping. Fast, updated records without needing continuous follow-ups."
            ],
            "NRI Taxation": [
                "They are excellent with NRI tax laws. Handled my foreign income questions and filings perfectly.",
                "Very smooth experience dealing with NRI compliance issues from abroad. Highly knowledgeable team.",
                "They sorted out my double taxation worries completely. Super professional and highly clear communication."
            ],
            "Company Incorporation": [
                "They made our registration process so quick and easy. Handled all the documentation cleanly.",
                "Incredible support for setting up our new company. Everything from paperwork to registration was seamless.",
                "Great experience incorporating our business. They managed the whole process perfectly on time."
            ],
            "Other": [
                "The experience was absolutely wonderful. The team went out of their way to handle things cleanly.",
                "Incredibly professional service and very friendly staff. Highly recommended to everyone.",
                "Exceeded all my expectations. Fast turnaround time and great support throughout."
            ]
        };

        const generalConnectors = [
            "Everything was done smoothly and right on time. Highly recommend their services!",
            "Super professional team and totally hassle-free process. Five stars!",
            "They really listen to your needs and handle everything with extreme care.",
            "Very satisfied with the quick support and seamless experience. Will definitely continue with them."
        ];

        function handleOtherChange(otherCheckbox) {
            const standardCategories = document.querySelectorAll('input[name="category"]');
            const otherTextField = document.getElementById('otherText');
            
            if (otherCheckbox.checked) {
                standardCategories.forEach(cb => {
                    cb.checked = false;
                    cb.disabled = true;
                    cb.parentElement.classList.add('disabled');
                });
                otherTextField.disabled = false;
                otherTextField.required = true;
                otherTextField.focus();
            } else {
                standardCategories.forEach(cb => {
                    cb.disabled = false;
                    cb.parentElement.classList.remove('disabled');
                });
                otherTextField.disabled = true;
                otherTextField.required = false;
                otherTextField.value = "";
            }
        }

        function handleCategoryChange(checkbox) {
            document.getElementById('otherCheckbox').checked = false;
            document.getElementById('otherText').disabled = true;
            document.getElementById('otherText').required = false;
            document.getElementById('otherText').value = "";
        }

        function getSelectedCategories() {
            const isOtherChecked = document.getElementById('otherCheckbox').checked;
            if (isOtherChecked) {
                const customVal = document.getElementById('otherText').value.trim();
                return customVal ? [customVal] : ["Other"];
            }

            const checkboxes = document.querySelectorAll('input[name="category"]:checked');
            const selected = [];
            checkboxes.forEach(cb => {
                selected.push(cb.value);
            });
            return selected;
        }

        function generateAndShowPopUp() {
            const fname = document.getElementById('firstName').value.trim();
            const lname = document.getElementById('lastName').value.trim();
            const location = document.getElementById('location').value.trim();
            const checkedProfession = document.querySelector('input[name="profession"]:checked');
            const categories = getSelectedCategories();

            if (!fname || !lname) {
                alert("Please fill out both First Name and Last Name fields.");
                return;
            }
            if (!checkedProfession) {
                alert("Please select your Profession.");
                return;
            }
            if (!location) {
                alert("Please enter your Location.");
                return;
            }
            if (categories.length === 0 || (document.getElementById('otherCheckbox').checked && !document.getElementById('otherText').value.trim())) {
                alert("Please check a category or type your choice in the 'Other' field!");
                return;
            }

            const userProfession = checkedProfession.value;
            const isOtherChecked = document.getElementById('otherCheckbox').checked;

            let userReviewText = "";
            
            if (isOtherChecked) {
                const pool = reviewTemplates["Other"];
                userReviewText = pool[Math.floor(Math.random() * pool.length)];
            } else if (categories.length === 1) {
                const cat = categories[0];
                const pool = reviewTemplates[cat];
                userReviewText = pool[Math.floor(Math.random() * pool.length)];
            } else {
                const randomClosing = generalConnectors[Math.floor(Math.random() * generalConnectors.length)];
                
                let listedItems = "";
                if (categories.length === 2) {
                    listedItems = categories.join(" and ");
                } else {
                    listedItems = categories.slice(0, -1).join(", ") + " and " + categories[categories.length - 1];
                }
                
                const multiPool = [
                    `The team provided exceptional and very prompt support handling our ${listedItems} requirements.`,
                    `Really great experience working with them for our ${listedItems} work.`,
                    `They made the entire process for our ${listedItems} completely stress-free and smooth.`
                ];
                
                userReviewText = `${multiPool[Math.floor(Math.random() * multiPool.length)]} ${randomClosing}`;
            }

            let categoryString = "";
            if (categories.length === 1) {
                categoryString = categories[0] + " business category";
            } else {
                categoryString = categories.slice(0, -1).join(", ") + " and " + categories[categories.length - 1] + " business categories";
            }

            const fullyBuiltDraft = `My name is ${fname} ${lname}. I am a ${userProfession} from ${location}. I avail the ${categoryString}. ${userReviewText}`;

            document.getElementById('draftText').innerText = fullyBuiltDraft;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('copyBtnText').innerText = "Copy Draft Text";
            document.getElementById('googleLink').style.display = 'none';
        }

        function copyDraft() {
            const textToCopy = document.getElementById('draftText').innerText;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                document.getElementById('copyBtnText').innerText = "Copied! ✓";
                document.getElementById('googleLink').style.display = 'inline-block';
            }).catch(err => {
                console.error('Could not copy text: ', err);
            });
        }
    </script>
</body>
</html>
